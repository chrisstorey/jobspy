{% extends "base.html" %}
{% block content %}
<div class="card mb-4">
    <div class="card-body">
        <h1 class="card-title">{{ job.title }}</h1>
        <p class="card-text"><strong>Location:</strong> {{ job.location }}</p>
        <p class="card-text"><strong>Salary:</strong> {{ job.salary }}</p>
        <div id="map" style="height: 400px; margin-bottom: 20px;"></div>
        <div class="card-text">{{ job.description|safe }}</div>
        {% if job.job_url %}
        <a href="{{ job.job_url }}" class="btn btn-primary mt-3" target="_blank">Apply Now</a>
        {% endif %}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Extract first part of location (before comma or parenthesis)
        const fullLocation = "{{ job.location }}";
        const location = fullLocation.split(/[,(]/)[0].trim();

        // Initialize map
        const map = L.map('map').setView([0, 0], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Geocode location using Nominatim
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)},UK`)
            .then(response => response.json())
            .then(data => {
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 13);
                    L.marker([lat, lon])
                        .addTo(map)
                        .bindPopup(location);
                }
            })
            .catch(error => console.error('Error:', error));
    });
</script>
{% endblock %}
