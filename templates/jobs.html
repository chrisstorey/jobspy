{% extends "base.html" %}
{% block content %}
<div class="container">
    {% if job %}
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title" style="color: var(--primary-blue)">{{ job.title }}</h2>
                <div class="mb-3">
                    <p class="text-muted mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt" viewBox="0 0 16 16">
                            <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A31.493 31.493 0 0 1 8 14.58a31.481 31.481 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94zM8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10z"/>
                            <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        </svg>
                        {{ job.location }}
                    </p>
                    <p class="text-muted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-currency-pound" viewBox="0 0 16 16">
                            <path d="M4 8.585h1.969c.115.465.186.939.186 1.415 0 1.563-.792 2.367-2.736 2.367v1.245h8.34v-1.245h-1.363c.276-1.044.763-2.209.763-3.47 0-1.698-1.232-2.897-2.83-2.897-1.261 0-2.128.635-2.128 1.961 0 .592.337.965.897.965.575 0 .873-.356.873-.813 0-.527-.286-.708-.708-.708-.052 0-.19.005-.34.034.233-.828.896-1.3 1.767-1.3 1.092 0 1.939.831 1.939 2.548 0 1.089-.339 2.097-.79 3.47H4V8.585z"/>
                        </svg>
                        {{ job.salary }}
                    </p>
                </div>

                <div class="job-description mb-4">
                    {{ job.description | safe }}
                </div>

                <a href="{{ job.job_url }}" class="btn btn-primary" target="_blank">
                    Apply on External Site
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-up-right ms-2" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z"/>
                        <path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z"/>
                    </svg>
                </a>
            </div>
        </div>

        {% if job.location %}
            <div id="map" style="height: 400px;" class="mb-4"></div>
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
            <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
            <script>
                // Your existing map code here
            </script>
        {% endif %}
    {% else %}
        <p class="text-center" style="color: var(--text-dark)">No jobs found.</p>
    {% endif %}
</div>
{% if pagination %}
    <!-- ...existing pagination code... -->
{% endif %}
{% endblock %}
