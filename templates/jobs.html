{% extends "base.html" %}
{% block content %}
<div class="row">
    {% if job %}
        <div class="col-md-8">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h2 class="card-title" style="color: var(--primary-blue)">{{ job.title }}</h2>
                    <p class="card-text" style="color: var(--text-dark)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt me-2" viewBox="0 0 16 16">
                            <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A31.493 31.493 0 0 1 8 14.58a31.481 31.481 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94zM8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10z"/>
                            <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        </svg>
                        {{ job.location }}
                    </p>
                    <div class="card-text">
                        {{ job.description | safe }}
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            {% if job.location %}
                <div class="card shadow-sm mb-3">
                    <div class="card-body p-0">
                        <div id="map" style="height: 300px;"></div>
                    </div>
                </div>
                <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
                <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
                <script>
                    fetch(`https://nominatim.openstreetmap.org/search?format=json&q={{ job.location }}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.length > 0) {
                                const lat = parseFloat(data[0].lat);
                                const lon = parseFloat(data[0].lon);

                                const map = L.map('map').setView([lat, lon], 13);
                                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                    maxZoom: 19,
                                    attribution: '© OpenStreetMap contributors'
                                }).addTo(map);

                                L.marker([lat, lon])
                                    .addTo(map)
                                    .bindPopup('{{ job.location }}')
                                    .openPopup();
                            }
                        })
                        .catch(error => console.error('Error:', error));
                </script>
            {% endif %}
        </div>
    {% else %}
        <p class="text-center" style="color: var(--text-dark)">No jobs found.</p>
    {% endif %}
</div>
<div class="d-flex justify-content-center">
    {{ pagination.links }}
</div>
{% endblock %}
