{% extends "base.html" %}

{% block content %}
<div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-xl">Sign in</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="govuk-error-summary" role="alert">
                        <h2 class="govuk-error-summary__title">Error</h2>
                        <div class="govuk-error-summary__body">
                            <p>{{ message }}</p>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="govuk-form-group">
                <label class="govuk-label" for="username">
                    Username
                </label>
                <input class="govuk-input" id="username" name="username" type="text" required>
            </div>

            <div class="govuk-form-group">
                <label class="govuk-label" for="password">
                    Password
                </label>
                <input class="govuk-input" id="password" name="password" type="password" required>
            </div>

            <button type="submit" class="govuk-button">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
